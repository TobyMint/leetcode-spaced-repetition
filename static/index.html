<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode 遗忘曲线刷题</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-lg font-bold text-gray-800">LeetCode 遗忘曲线</h1>
            <div class="flex gap-1">
                <button onclick="router.go('today')" data-nav="today"
                    class="nav-btn px-3 py-1.5 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100">今日任务</button>
                <button onclick="router.go('problems')" data-nav="problems"
                    class="nav-btn px-3 py-1.5 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100">题目总览</button>
                <button onclick="router.go('stats')" data-nav="stats"
                    class="nav-btn px-3 py-1.5 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100">统计</button>
                <button onclick="router.go('settings')" data-nav="settings"
                    class="nav-btn px-3 py-1.5 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100">设置</button>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main id="app" class="max-w-5xl mx-auto px-4 py-6"></main>

    <script src="/static/app.js"></script>
</body>
</html>
